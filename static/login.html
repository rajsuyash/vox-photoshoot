<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Donna Photoshoot</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c; --raised: rgba(255,255,255,.04); --line: rgba(255,255,255,.08);
    --ink: #f5f5f7; --muted: rgba(245,245,247,.6); --faint: rgba(245,245,247,.4);
    --copper: #c17f59; --copper-light: #d4a574; --error: #e57373;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 400 16px/1.55 Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    display: grid; grid-template-columns: 1fr;
  }
  /* On a phone the wall sits behind the form, so the form carries its own pool of
     dark to read against. Invisible on a wide screen, where this pane has nothing
     behind it but the page colour. */
  .pane { display: grid; place-items: center; padding: 24px;
    min-height: 100vh; position: relative; z-index: 1;
    background: radial-gradient(ellipse 150% 42% at 50% 50%,
                var(--bg) 35%, rgba(10, 10, 12, .8) 65%, transparent); }
  .box { width: 100%; max-width: 380px; }
  .logo { display: flex; align-items: center; gap: 8px; justify-content: center;
    font-size: 20px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 8px; }
  .logo b { color: var(--copper); }
  .logo span { font-weight: 400; color: var(--muted); }
  .sub { text-align: center; color: var(--faint); font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; font-weight: 600; margin-bottom: 34px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input { font: inherit; font-size: 15px; color: var(--ink); width: 100%;
    padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--raised); margin-bottom: 16px; }
  input:focus { outline: 1px solid var(--copper); outline-offset: -1px;
    border-color: var(--copper); }
  button { width: 100%; border: 0; border-radius: 999px; padding: 13px;
    font: inherit; font-size: 14px; font-weight: 600;
    background: var(--copper); color: var(--bg); cursor: pointer; }
  button:hover:not(:disabled) { background: var(--copper-light); }
  button:disabled { background: var(--raised); color: var(--faint); cursor: not-allowed; }
  .error { background: rgba(229,115,115,.10); border: 1px solid rgba(229,115,115,.28);
    color: var(--error); padding: 11px 14px; border-radius: 10px; font-size: 13px;
    margin-bottom: 16px; }
  .hint { color: var(--faint); font-size: 12px; text-align: center; margin-top: 22px;
    line-height: 1.5; }
  .hidden { display: none; }

  /* Google's own mark on a neutral surface. Deliberately not copper: a sign-in button
     that looks like the brand's primary action is one people mistrust. */
  .google { display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 12px; border-radius: 999px; font: inherit; font-size: 14px;
    font-weight: 600; text-decoration: none; color: var(--ink);
    background: var(--raised); border: 1px solid var(--line);
    transition: background .2s, border-color .2s; }
  .google:hover { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.16); }
  .google svg { flex: none; }

  /* "or" rule between the two ways in. */
  .split { display: flex; align-items: center; gap: 12px; margin: 22px 0 18px;
    color: var(--faint); font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; }
  .split::before, .split::after { content: ''; flex: 1; height: 1px;
    background: var(--line); }

  /* The wall. Real output from real shoots — the argument for the product is the
     pictures, not a sentence about the pictures. Decorative, so it is aria-hidden
     and the whole thing is skipped by a screen reader.

     Below 980px it sits behind the form as a dimmed backdrop rather than beside it:
     a phone has no room for two columns, and an empty half is worse than none. */
  .wall { position: fixed; inset: 0; z-index: 0; opacity: .09;
    overflow: hidden; display: grid; grid-template-columns: repeat(4, 1fr);
    /* start, not the grid default of stretch: stretched columns are all as tall as
       the tallest, and -25% of a height that is not four copies of the list lands
       mid-tile, which is exactly the seam this is arranged to avoid. */
    align-items: start; gap: 12px; padding: 12px; }
  /* The space between tiles is each tile's own margin, not a flex gap. A gap is not
     part of the last child, so a gapped column's height is 16 tiles + 15 gaps and
     -25% of it lands three-quarters of a gap short — a small jump, once a cycle. */
  .col { display: flex; flex-direction: column;
    animation: drift 90s linear infinite; will-change: transform; }
  .col:nth-child(2) { animation-duration: 120s; animation-direction: reverse; }
  .col:nth-child(3) { animation-duration: 105s; }
  .col:nth-child(4) { animation-duration: 135s; animation-direction: reverse; }
  .col img { width: 100%; display: block; border-radius: 10px;
    margin-bottom: 12px; background: var(--raised); }

  /* The list is rendered four times, so -25% lands exactly on the next copy's first
     tile and the seam never shows. Any other distance jumps once a cycle. */
  @keyframes drift { to { transform: translateY(-25%); } }

  @media (min-width: 980px) {
    body { grid-template-columns: minmax(420px, 44fr) 56fr;
      height: 100vh; overflow: hidden; }
    .wall { position: relative; inset: auto; opacity: 1; padding: 0; }
    /* The wall dissolves into the page instead of ending at a hard rectangle, and
       nothing at the top or bottom reads as cropped. Painted as a gradient in the
       page colour rather than a mask: mask-composite needs two engines to agree on
       multi-layer masks, and this needs neither. */
    .wall::after { content: ''; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(to right, var(--bg) 2%, transparent 26%),
                  linear-gradient(to bottom, var(--bg), transparent 18%,
                                  transparent 82%, var(--bg)); }
  }

  @media (prefers-reduced-motion: reduce) { .col { animation: none; } }
</style>
</head>
<body>
<div class="pane">
<div class="box">
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2L2 8L12 14L22 8L12 2Z" fill="#c17f59"/>
      <path d="M2 16L12 22L22 16" stroke="#c17f59" stroke-width="2" fill="none"/>
      <path d="M2 12L12 18L22 12" stroke="#c17f59" stroke-width="2" fill="none" opacity="0.5"/>
    </svg>
    <b>Donna</b>&nbsp;<span>Photoshoot</span>
  </div>
  <p class="sub">product photo to campaign imagery</p>

  <div id="error" class="error hidden"></div>

  <!-- A plain link, not a script. The Google SDK would put a third-party tag on the
       one page every user must load, to save a redirect we are doing anyway. -->
  <a class="google" href="/api/auth/google">
    <svg width="17" height="17" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.2-.4-4.7H24v8.9h11.8c-.5 2.7-2 5-4.4 6.600v5.5h7.1c4.2-3.8 6.6-9.5 6.6-16.3z"/>
      <path fill="#34A853" d="M24 46c6 0 11-2 14.6-5.4l-7.1-5.5c-2 1.3-4.5 2.1-7.5 2.1-5.8 0-10.7-3.9-12.4-9.750H4.3v5.7C7.9 40.9 15.4 46 24 46z"/>
      <path fill="#FBBC05" d="M11.6 27.45c-.45-1.3-.7-2.7-.7-4.15s.25-2.85.7-4.15V13.4H4.3a22 22 0 000 19.75l7.3-5.7z"/>
      <path fill="#EA4335" d="M24 10.7c3.3 0 6.2 1.1 8.5 3.3l6.3-6.3C35 4.1 30 2 24 2 15.4 2 7.9 7.1 4.3 13.4l7.3 5.7C13.3 14.6 18.2 10.7 24 10.7z"/>
    </svg>
    Continue with Google
  </a>

  <div class="split">or</div>

  <form id="form">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">Sign in</button>
  </form>

  <p class="hint">New here? Continue with Google — you get credits to try it<br>on your own
    pieces, with nothing to set up and no card.</p>
</div>
</div>

<div class="wall" id="wall" aria-hidden="true"></div>

<script>
const $ = (id) => document.getElementById(id);

// Four columns of shoot output, each column's list written twice so the drift can
// loop on -50% without a seam. Built here rather than as 32 <img> tags because the
// second copy has to be identical to the first, and hand-kept lists stop being.
const SHOWCASE = 16;
const COLUMNS = 4;
// The ones tools/build_showcase.py centre-crops. Declared so the box is the right
// shape before the bytes land — otherwise the whole wall reflows as it loads.
const SQUARE = new Set([1, 3, 4, 7, 8, 10, 13, 15]);
// Four copies, and the drift stops at -25%. Three would be enough on a laptop and
// leaves a bare strip at the bottom of a tall phone: the loop only hides its seam
// while (COPIES - 1) x one-copy-height still covers the viewport.
const COPIES = 4;

for (let column = 0; column < COLUMNS; column++) {
  const node = document.createElement('div');
  node.className = 'col';
  for (let copy = 0; copy < COPIES; copy++) {
    for (let i = column; i < SHOWCASE; i += COLUMNS) {
      const image = new Image();
      image.src = `/showcase/${String(i).padStart(2, '0')}.jpg`;
      image.alt = '';
      image.decoding = 'async';
      image.style.aspectRatio = SQUARE.has(i) ? '1 / 1' : '3 / 4';
      node.append(image);
    }
  }
  $('wall').append(node);
}

// The Google callback sends failures back here rather than rendering a stack trace at
// a stranger. textContent, never innerHTML — the message travels through a query
// string, so treating it as markup would be a reflected-XSS hole on the login page.
const failure = new URLSearchParams(location.search).get('error');
if (failure) {
  $('error').textContent = failure;
  $('error').classList.remove('hidden');
  history.replaceState({}, '', location.pathname);
}

$('form').addEventListener('submit', async (event) => {
  event.preventDefault();
  $('go').disabled = true;
  $('go').textContent = 'Signing in…';
  $('error').classList.add('hidden');

  const body = new FormData();
  body.append('email', $('email').value);
  body.append('password', $('password').value);

  try {
    const response = await fetch('/api/auth/login', { method: 'POST', body });
    if (!response.ok) {
      const detail = (await response.json().catch(() => ({}))).detail;
      throw new Error(detail || 'could not sign in');
    }
    // ?next= is set by the gate when a deep link was interrupted by the login page.
    const next = new URLSearchParams(location.search).get('next');
    location.href = next && next.startsWith('/') ? next : '/';
  } catch (error) {
    $('error').textContent = String(error.message || error);
    $('error').classList.remove('hidden');
    $('go').disabled = false;
    $('go').textContent = 'Sign in';
  }
});
</script>
</body>
</html>
