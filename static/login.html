<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Donna Photoshoot</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c; --raised: rgba(255,255,255,.04); --line: rgba(255,255,255,.08);
    --ink: #f5f5f7; --muted: rgba(245,245,247,.6); --faint: rgba(245,245,247,.4);
    --copper: #c17f59; --copper-light: #d4a574; --error: #e57373;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 400 16px/1.55 Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    display: grid; place-items: center; padding: 24px;
  }
  .box { width: 100%; max-width: 380px; }
  .logo { display: flex; align-items: center; gap: 8px; justify-content: center;
    font-size: 20px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 8px; }
  .logo b { color: var(--copper); }
  .logo span { font-weight: 400; color: var(--muted); }
  .sub { text-align: center; color: var(--faint); font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; font-weight: 600; margin-bottom: 34px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input { font: inherit; font-size: 15px; color: var(--ink); width: 100%;
    padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--raised); margin-bottom: 16px; }
  input:focus { outline: 1px solid var(--copper); outline-offset: -1px;
    border-color: var(--copper); }
  button { width: 100%; border: 0; border-radius: 999px; padding: 13px;
    font: inherit; font-size: 14px; font-weight: 600;
    background: var(--copper); color: var(--bg); cursor: pointer; }
  button:hover:not(:disabled) { background: var(--copper-light); }
  button:disabled { background: var(--raised); color: var(--faint); cursor: not-allowed; }
  .error { background: rgba(229,115,115,.10); border: 1px solid rgba(229,115,115,.28);
    color: var(--error); padding: 11px 14px; border-radius: 10px; font-size: 13px;
    margin-bottom: 16px; }
  .hint { color: var(--faint); font-size: 12px; text-align: center; margin-top: 22px;
    line-height: 1.5; }
  .hidden { display: none; }

  /* Google's own mark on a neutral surface. Deliberately not copper: a sign-in button
     that looks like the brand's primary action is one people mistrust. */
  .google { display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 12px; border-radius: 999px; font: inherit; font-size: 14px;
    font-weight: 600; text-decoration: none; color: var(--ink);
    background: var(--raised); border: 1px solid var(--line);
    transition: background .2s, border-color .2s; }
  .google:hover { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.16); }
  .google svg { flex: none; }

  /* "or" rule between the two ways in. */
  .split { display: flex; align-items: center; gap: 12px; margin: 22px 0 18px;
    color: var(--faint); font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; }
  .split::before, .split::after { content: ''; flex: 1; height: 1px;
    background: var(--line); }
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2L2 8L12 14L22 8L12 2Z" fill="#c17f59"/>
      <path d="M2 16L12 22L22 16" stroke="#c17f59" stroke-width="2" fill="none"/>
      <path d="M2 12L12 18L22 12" stroke="#c17f59" stroke-width="2" fill="none" opacity="0.5"/>
    </svg>
    <b>Donna</b>&nbsp;<span>Photoshoot</span>
  </div>
  <p class="sub">product photo to campaign imagery</p>

  <div id="error" class="error hidden"></div>

  <!-- A plain link, not a script. The Google SDK would put a third-party tag on the
       one page every user must load, to save a redirect we are doing anyway. -->
  <a class="google" href="/api/auth/google">
    <svg width="17" height="17" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.2-.4-4.7H24v8.9h11.8c-.5 2.7-2 5-4.4 6.600v5.5h7.1c4.2-3.8 6.6-9.5 6.6-16.3z"/>
      <path fill="#34A853" d="M24 46c6 0 11-2 14.6-5.4l-7.1-5.5c-2 1.3-4.5 2.1-7.5 2.1-5.8 0-10.7-3.9-12.4-9.750H4.3v5.7C7.9 40.9 15.4 46 24 46z"/>
      <path fill="#FBBC05" d="M11.6 27.45c-.45-1.3-.7-2.7-.7-4.15s.25-2.85.7-4.15V13.4H4.3a22 22 0 000 19.75l7.3-5.7z"/>
      <path fill="#EA4335" d="M24 10.7c3.3 0 6.2 1.1 8.5 3.3l6.3-6.3C35 4.1 30 2 24 2 15.4 2 7.9 7.1 4.3 13.4l7.3 5.7C13.3 14.6 18.2 10.7 24 10.7z"/>
    </svg>
    Continue with Google
  </a>

  <div class="split">or</div>

  <form id="form">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">Sign in</button>
  </form>

  <p class="hint">New here? Continue with Google — you get credits to try it<br>on your own
    pieces, with nothing to set up and no card.</p>
</div>

<script>
const $ = (id) => document.getElementById(id);

// The Google callback sends failures back here rather than rendering a stack trace at
// a stranger. textContent, never innerHTML — the message travels through a query
// string, so treating it as markup would be a reflected-XSS hole on the login page.
const failure = new URLSearchParams(location.search).get('error');
if (failure) {
  $('error').textContent = failure;
  $('error').classList.remove('hidden');
  history.replaceState({}, '', location.pathname);
}

$('form').addEventListener('submit', async (event) => {
  event.preventDefault();
  $('go').disabled = true;
  $('go').textContent = 'Signing in…';
  $('error').classList.add('hidden');

  const body = new FormData();
  body.append('email', $('email').value);
  body.append('password', $('password').value);

  try {
    const response = await fetch('/api/auth/login', { method: 'POST', body });
    if (!response.ok) {
      const detail = (await response.json().catch(() => ({}))).detail;
      throw new Error(detail || 'could not sign in');
    }
    // ?next= is set by the gate when a deep link was interrupted by the login page.
    const next = new URLSearchParams(location.search).get('next');
    location.href = next && next.startsWith('/') ? next : '/';
  } catch (error) {
    $('error').textContent = String(error.message || error);
    $('error').classList.remove('hidden');
    $('go').disabled = false;
    $('go').textContent = 'Sign in';
  }
});
</script>
</body>
</html>
