<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Donna Photoshoot</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c; --raised: rgba(255,255,255,.04); --line: rgba(255,255,255,.08);
    --ink: #f5f5f7; --muted: rgba(245,245,247,.6); --faint: rgba(245,245,247,.4);
    --copper: #c17f59; --copper-light: #d4a574; --error: #e57373;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 400 16px/1.55 Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    display: grid; place-items: center; padding: 24px;
  }
  .box { width: 100%; max-width: 380px; }
  .logo { display: flex; align-items: center; gap: 8px; justify-content: center;
    font-size: 20px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 8px; }
  .logo b { color: var(--copper); }
  .logo span { font-weight: 400; color: var(--muted); }
  .sub { text-align: center; color: var(--faint); font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; font-weight: 600; margin-bottom: 34px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input { font: inherit; font-size: 15px; color: var(--ink); width: 100%;
    padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--raised); margin-bottom: 16px; }
  input:focus { outline: 1px solid var(--copper); outline-offset: -1px;
    border-color: var(--copper); }
  button { width: 100%; border: 0; border-radius: 999px; padding: 13px;
    font: inherit; font-size: 14px; font-weight: 600;
    background: var(--copper); color: var(--bg); cursor: pointer; }
  button:hover:not(:disabled) { background: var(--copper-light); }
  button:disabled { background: var(--raised); color: var(--faint); cursor: not-allowed; }
  .error { background: rgba(229,115,115,.10); border: 1px solid rgba(229,115,115,.28);
    color: var(--error); padding: 11px 14px; border-radius: 10px; font-size: 13px;
    margin-bottom: 16px; }
  .hint { color: var(--faint); font-size: 12px; text-align: center; margin-top: 22px;
    line-height: 1.5; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2L2 8L12 14L22 8L12 2Z" fill="#c17f59"/>
      <path d="M2 16L12 22L22 16" stroke="#c17f59" stroke-width="2" fill="none"/>
      <path d="M2 12L12 18L22 12" stroke="#c17f59" stroke-width="2" fill="none" opacity="0.5"/>
    </svg>
    <b>Donna</b>&nbsp;<span>Photoshoot</span>
  </div>
  <p class="sub">product photo to campaign imagery</p>

  <div id="error" class="error hidden"></div>

  <form id="form">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">Sign in</button>
  </form>

  <p class="hint">Accounts are created for you.<br>Ask your account manager if you need one.</p>
</div>

<script>
const $ = (id) => document.getElementById(id);

$('form').addEventListener('submit', async (event) => {
  event.preventDefault();
  $('go').disabled = true;
  $('go').textContent = 'Signing in…';
  $('error').classList.add('hidden');

  const body = new FormData();
  body.append('email', $('email').value);
  body.append('password', $('password').value);

  try {
    const response = await fetch('/api/auth/login', { method: 'POST', body });
    if (!response.ok) {
      const detail = (await response.json().catch(() => ({}))).detail;
      throw new Error(detail || 'could not sign in');
    }
    // ?next= is set by the gate when a deep link was interrupted by the login page.
    const next = new URLSearchParams(location.search).get('next');
    location.href = next && next.startsWith('/') ? next : '/';
  } catch (error) {
    $('error').textContent = String(error.message || error);
    $('error').classList.remove('hidden');
    $('go').disabled = false;
    $('go').textContent = 'Sign in';
  }
});
</script>
</body>
</html>
